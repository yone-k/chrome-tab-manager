name: Release CI

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Install dependencies
        run: pnpm install
      - name: Run checks
        run: pnpm check
      - name: Run tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
